name: rag_research_workflow_self_test
description: 'Self-test RAG flow against the AgentForge source collection.'
nodes:
- id: kb_retriever
  node_type: retrieval
  inputs: []
  config:
    collection_name: agentforge_self_test
    vector_store_type: chroma
    persist_directory: ./chroma_db
    embedding_provider: bge
    embedding_model: BAAI/bge-small-en-v1.5
    top_k: 4
    rerank: true
    rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2

- id: researcher
  node_type: agent
  role: researcher
  goal: 'Review the retrieved AgentForge code context from kb_retriever and answer with concrete code specifics.'
  inputs:
  - kb_retriever
  tools: []
  model: null
  max_iterations: 4

- id: writer
  node_type: agent
  role: writer
  goal: 'Synthesize the researcher findings into a final response.'
  inputs:
  - researcher
  tools: []
  model: null
  max_iterations: 4
